// This directory is never a main source set, even when a previous probe exists.
if (sshControlProbeOption == 'true') {
    tasks.register('compileSshKexProbe', Exec) {
        inputs.files('src/main/cpp/ssh_kex_guard.c', 'src/main/cpp/ssh_kex_guard.h',
            'src/main/cpp/ssh_role_bootstrap.c', 'src/main/cpp/ssh_role_bootstrap.h', 'src/test/cpp/ssh_kex_test.c',
            'src/main/cpp/ssh_native_launcher.c', 'src/main/cpp/ssh_native_launcher.h',
            '../../.trellis/tasks/10-08-ssh-terminal-client/research/android-kex-build.sh',
            '../../.trellis/tasks/10-08-ssh-terminal-client/research/openssh-10.6p1-kex-guard.patch')
        outputs.dir(layout.buildDirectory.dir('generated/sshKexProbeJniLibs'))
        outputs.dir(layout.buildDirectory.dir('generated/sshKexProbeAssets'))
        commandLine 'bash', '/app/.trellis/tasks/10-08-ssh-terminal-client/research/android-kex-build.sh', '--build'
    }
    def sshControlProbe = layout.buildDirectory.file('generated/sshControlProbeJniLibs/arm64-v8a/libctos_ssh_control_probe.so')
    tasks.register('compileSshControlProbe', Exec) {
        inputs.files('src/main/cpp/ssh_control.c', 'src/main/cpp/ssh_control.h', 'src/test/cpp/ssh_control_test.c')
        outputs.file(sshControlProbe)
        doFirst {
            sshControlProbe.get().asFile.parentFile.mkdirs()
            commandLine "${android.ndkDirectory}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang",
                '-std=c11', '-fPIE', '-pie', '-O2', '-Wall', '-Wextra', '-Werror', '-Wl,-z,max-page-size=16384',
                '-Isrc/main/cpp', 'src/main/cpp/ssh_control.c', 'src/test/cpp/ssh_control_test.c', '-o', sshControlProbe.get().asFile
        }
    }
    tasks.matching { it.name == 'preSecretsFixtureReleaseBuild' || it.name == 'preSecretsFixtureDebugBuild' }.configureEach {
        dependsOn 'compileSshControlProbe', 'compileSshKexProbe'
    }
}

