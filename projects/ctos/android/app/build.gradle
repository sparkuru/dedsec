plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}
android {
    namespace 'im.majo.ctos'
    compileSdk 36
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'im.majo.ctos'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
    sourceSets.main.jniLibs.srcDirs += [layout.buildDirectory.dir('generated/jniLibs').get().asFile]
    testBuildType 'release'
}
flutter { source '../..' }
dependencies {
    compileOnly files('libs/xposed-api-82.jar')
    implementation 'androidx.core:core:1.15.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
}

def ptyOutput = layout.buildDirectory.file('generated/jniLibs/arm64-v8a/libctos_pty.so')
tasks.register('compilePty', Exec) {
    inputs.file('src/main/cpp/pty.c')
    outputs.file(ptyOutput)
    doFirst {
        ptyOutput.get().asFile.parentFile.mkdirs()
        commandLine "${android.ndkDirectory}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang",
            '-shared', '-fPIC', '-O2', '-Wall', '-Wextra', '-Werror', '-Wl,-z,max-page-size=16384',
            'src/main/cpp/pty.c', '-o', ptyOutput.get().asFile
    }
}
tasks.named('preBuild').configure { dependsOn 'compilePty' }
