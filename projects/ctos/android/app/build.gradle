plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.chaquo.python'
}
def secretsFixtureOption = providers.gradleProperty('ctosSecretsUiFixture').orNull
if (secretsFixtureOption != null && secretsFixtureOption != 'true') {
    throw new GradleException('ctosSecretsUiFixture accepts only true; omit it for the normal application')
}
android {
    namespace 'im.majo.ctos'
    compileSdk 36
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'im.majo.ctos'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
    sourceSets.main.jniLibs.srcDirs += [layout.buildDirectory.dir('generated/jniLibs').get().asFile]
    packaging { jniLibs { useLegacyPackaging = true } }
    testBuildType 'release'
    if (secretsFixtureOption == 'true') {
        flavorDimensions += 'secretsFixtureValidation'
        productFlavors {
            secretsFixture {
                dimension 'secretsFixtureValidation'
                applicationId 'im.majo.ctos.secretsfixture'
                testApplicationId 'im.majo.ctos.secretsfixture.test'
            }
        }
        // Replace the base test manifest only in this opt-in build. The normal test
        // provider's fixed authority and grants must never be merged into this UID.
        sourceSets.androidTest.manifest.srcFile('src/secretsFixtureTest/AndroidManifest.xml')
        sourceSets.androidTest.java.setSrcDirs([])
    }
}
chaquopy {
    defaultConfig {
        version = '3.13'
        buildPython '/app/.devhome/python/cpython-3.13.7-linux-x86_64-gnu/bin/python3.13'
        pip {
            install 'cryptography==42.0.8'
            install 'cffi==1.17.1'
            install 'pycparser==3.0'
            install 'chaquopy-libffi==3.3'
        }
        pyc { src = false }
    }
}
flutter { source '../..' }
dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
}

def ptyOutput = layout.buildDirectory.file('generated/jniLibs/arm64-v8a/libctos_pty.so')
tasks.register('compilePty', Exec) {
    inputs.file('src/main/cpp/pty.c')
    outputs.file(ptyOutput)
    doFirst {
        ptyOutput.get().asFile.parentFile.mkdirs()
        commandLine "${android.ndkDirectory}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang",
            '-shared', '-fPIC', '-O2', '-Wall', '-Wextra', '-Werror', '-Wl,-z,max-page-size=16384',
            'src/main/cpp/pty.c', '-o', ptyOutput.get().asFile
    }
}
tasks.named('preBuild').configure { dependsOn 'compilePty' }

def pythonExecutable = layout.buildDirectory.file('generated/jniLibs/arm64-v8a/libctos_python_exec.so')
tasks.register('compilePythonExecutable', Exec) {
    inputs.file('src/main/cpp/python_exec.c')
    outputs.file(pythonExecutable)
    doFirst {
        pythonExecutable.get().asFile.parentFile.mkdirs()
        commandLine "${android.ndkDirectory}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang",
            '-fPIE', '-pie', '-O2', '-Wall', '-Wextra', '-Werror', '-Wl,-z,max-page-size=16384',
            'src/main/cpp/python_exec.c', '-ldl', '-o', pythonExecutable.get().asFile
    }
}
tasks.named('preBuild').configure { dependsOn 'compilePythonExecutable' }

def hftpRelay = layout.buildDirectory.file('generated/jniLibs/arm64-v8a/libctos_hftp_relay.so')
tasks.register('compileHftpRelay', Exec) {
    inputs.file('src/main/cpp/hftp_relay.c')
    outputs.file(hftpRelay)
    doFirst {
        hftpRelay.get().asFile.parentFile.mkdirs()
        commandLine "${android.ndkDirectory}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang",
            '-fPIE', '-pie', '-O2', '-Wall', '-Wextra', '-Werror', '-Wl,-z,max-page-size=16384',
            'src/main/cpp/hftp_relay.c', '-landroid', '-o', hftpRelay.get().asFile
    }
}
tasks.named('preBuild').configure { dependsOn 'compileHftpRelay' }
