            '-std=c11', '-shared', '-fPIC', '-O2', '-Wall', '-Wextra', '-Werror', '-Wl,-z,max-page-size=16384',
            'src/main/cpp/ssh_file_view.c', 'src/main/cpp/ssh_file_io.c', 'src/main/cpp/ssh_file_jni.c',
