plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.chaquo.python'
}
def secretsFixtureOption = providers.gradleProperty('ctosSecretsUiFixture').orNull
if (secretsFixtureOption != null && secretsFixtureOption != 'true') {
    throw new GradleException('ctosSecretsUiFixture accepts only true; omit it for the normal application')
}
def sshMemoryProbeOption = providers.gradleProperty('ctosSshMemoryProbe').orNull
if (sshMemoryProbeOption != null && sshMemoryProbeOption != 'true') {
    throw new GradleException('ctosSshMemoryProbe accepts only true; omit it for normal builds')
}
if (sshMemoryProbeOption == 'true' && secretsFixtureOption != 'true') {
    throw new GradleException('ctosSshMemoryProbe requires ctosSecretsUiFixture=true')
}
def sshUpstreamProbeOption = providers.gradleProperty('ctosSshUpstreamProbe').orNull
if (sshUpstreamProbeOption != null && sshUpstreamProbeOption != 'true') {
    throw new GradleException('ctosSshUpstreamProbe accepts only true; omit it for normal builds')
}
if (sshUpstreamProbeOption == 'true' && secretsFixtureOption != 'true') {
    throw new GradleException('ctosSshUpstreamProbe requires ctosSecretsUiFixture=true')
}
def sshUpstreamBaselineOption = providers.gradleProperty('ctosSshUpstreamBaseline').orNull
if (sshUpstreamBaselineOption != null && sshUpstreamProbeOption != 'true') {
    throw new GradleException('ctosSshUpstreamBaseline requires ctosSshUpstreamProbe=true')
}
File sshUpstreamBaseline = null
def sshPolicyProbeOption = providers.gradleProperty('ctosSshPolicyProbe').orNull
if (sshPolicyProbeOption != null && sshPolicyProbeOption != 'true') {
    throw new GradleException('ctosSshPolicyProbe accepts only true; omit it for normal builds')
}
if (sshPolicyProbeOption == 'true' && secretsFixtureOption != 'true') {
    throw new GradleException('ctosSshPolicyProbe requires ctosSecretsUiFixture=true')
}
if (sshPolicyProbeOption == 'true' && (sshMemoryProbeOption != null || sshUpstreamProbeOption != null)) {
    throw new GradleException('ctosSshPolicyProbe must be packaged independently of other SSH probes')
}
def sshControlProbeOption = providers.gradleProperty('ctosSshControlProbe').orNull
if (sshControlProbeOption != null && sshControlProbeOption != 'true') {
    throw new GradleException('ctosSshControlProbe accepts only true; omit it for normal builds')
}
if (sshControlProbeOption == 'true' && secretsFixtureOption != 'true') {
    throw new GradleException('ctosSshControlProbe requires ctosSecretsUiFixture=true')
}
if (sshControlProbeOption == 'true' && (sshMemoryProbeOption != null || sshUpstreamProbeOption != null || sshPolicyProbeOption != null)) {
    throw new GradleException('ctosSshControlProbe must be packaged independently of other SSH probes')
}
if (sshUpstreamProbeOption == 'true') {
    if (sshUpstreamBaselineOption == null || !(sshUpstreamBaselineOption ==~ '/app/build/ssh-native-g1/stock-run\\.[A-Za-z0-9_-]+')) {
        throw new GradleException('ctosSshUpstreamBaseline must identify one fixed /app/build/ssh-native-g1/stock-run.<id> directory')
    }
    sshUpstreamBaseline = new File(sshUpstreamBaselineOption)
    if (!sshUpstreamBaseline.isDirectory() || sshUpstreamBaseline.canonicalPath != sshUpstreamBaselineOption) {
        throw new GradleException('ctosSshUpstreamBaseline must be an existing canonical directory without symlinks')
    }
    for (File component = sshUpstreamBaseline; component != null; component = component.parentFile) {
        if (java.nio.file.Files.isSymbolicLink(component.toPath())) {
            throw new GradleException('ctosSshUpstreamBaseline path must not contain symlinks')
        }
    }
}
android {
    namespace 'im.majo.ctos'
    compileSdk 36
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'im.majo.ctos'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
    sourceSets.main.jniLibs.srcDirs += [layout.buildDirectory.dir('generated/jniLibs').get().asFile]
    packaging { jniLibs { useLegacyPackaging = true } }
    testBuildType 'release'
    if (secretsFixtureOption == 'true') {
        flavorDimensions += 'secretsFixtureValidation'
        productFlavors {
            secretsFixture {
                dimension 'secretsFixtureValidation'
                applicationId 'im.majo.ctos.secretsfixture'
                testApplicationId 'im.majo.ctos.secretsfixture.test'
            }
        }
        // Replace the base test manifest only in this opt-in build. The normal test
        // provider's fixed authority and grants must never be merged into this UID.
        sourceSets.androidTest.manifest.srcFile('src/secretsFixtureTest/AndroidManifest.xml')
        sourceSets.androidTest.java.setSrcDirs([])
        if (sshMemoryProbeOption == 'true') {
            sourceSets.secretsFixture.jniLibs.srcDirs += [layout.buildDirectory.dir('generated/sshProbeJniLibs').get().asFile]
        }
        if (sshUpstreamProbeOption == 'true') {
            sourceSets.secretsFixture.jniLibs.srcDirs += [layout.buildDirectory.dir('generated/sshUpstreamProbeJniLibs').get().asFile]
            sourceSets.secretsFixture.assets.srcDirs += [layout.buildDirectory.dir('generated/sshUpstreamProbeAssets').get().asFile]
        }
        if (sshPolicyProbeOption == 'true') {
            sourceSets.secretsFixture.jniLibs.srcDirs += [layout.buildDirectory.dir('generated/sshPolicyProbeJniLibs').get().asFile]
            sourceSets.secretsFixture.assets.srcDirs += [layout.buildDirectory.dir('generated/sshPolicyProbeAssets').get().asFile]
        }
        if (sshControlProbeOption == 'true') {
            sourceSets.secretsFixture.jniLibs.srcDirs += [layout.buildDirectory.dir('generated/sshControlProbeJniLibs').get().asFile]
            sourceSets.secretsFixture.jniLibs.srcDirs += [layout.buildDirectory.dir('generated/sshKexProbeJniLibs').get().asFile]
            sourceSets.secretsFixture.assets.srcDirs += [layout.buildDirectory.dir('generated/sshKexProbeAssets').get().asFile]
        }
    }
}
chaquopy {
    defaultConfig {
        version = '3.13'
        buildPython '/app/.devhome/python/cpython-3.13.7-linux-x86_64-gnu/bin/python3.13'
        pip {
            install 'cryptography==42.0.8'
            install 'cffi==1.17.1'
            install 'pycparser==3.0'
            install 'chaquopy-libffi==3.3'
        }
        pyc { src = false }
    }
}
flutter { source '../..' }
