// Policy outputs belong only to this opt-in independent fixture.
if (sshPolicyProbeOption == 'true') {
    def policyRunner = rootProject.file('../.trellis/tasks/10-08-ssh-terminal-client/research/android-policy-build.sh')
    def policyPatch = rootProject.file('../.trellis/tasks/10-08-ssh-terminal-client/research/openssh-10.6p1-config-policy.patch')
    tasks.register('compileSshPolicyProbe', Exec) {
        inputs.files('src/main/cpp/ssh_config_policy.c', 'src/main/cpp/ssh_config_policy.h', 'src/main/cpp/ssh_config_policy_probe.c',
            'src/main/cpp/ssh_file_view.c', 'src/main/cpp/ssh_file_view.h', 'src/main/cpp/ssh_file_io.c', 'src/main/cpp/ssh_file_io.h')
        inputs.files(policyRunner, policyPatch)
        // The fixed runner validates the full baseline before every build;
        // no Gradle snapshot/default exclusions can skip that verification.
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
        outputs.dir(layout.buildDirectory.dir('generated/sshPolicyProbeJniLibs'))
        outputs.dir(layout.buildDirectory.dir('generated/sshPolicyProbeAssets'))
        workingDir rootProject.file('..')
        commandLine 'bash', policyRunner.absolutePath, '--build'
    }
    tasks.matching { it.name == 'preSecretsFixtureReleaseBuild' || it.name == 'preSecretsFixtureDebugBuild' }.configureEach {
        dependsOn 'compileSshPolicyProbe'
    }
}

// The three upstream research executables and notices belong only to this
// opt-in fixture; normal builds cannot discover their stale generated output.
if (sshUpstreamProbeOption == 'true') {
    def upstreamRunner = rootProject.file('../.trellis/tasks/10-08-ssh-terminal-client/research/android-upstream-build.sh')
    def upstreamPatch = rootProject.file('../.trellis/tasks/10-08-ssh-terminal-client/research/openssh-10.6p1-bionic-includes.patch')
    def upstreamLibraries = layout.buildDirectory.dir('generated/sshUpstreamProbeJniLibs/arm64-v8a')
    def upstreamNotices = layout.buildDirectory.dir('generated/sshUpstreamProbeAssets/licenses/ssh-upstream')
    def baselineInput = { String relative, boolean directory ->
        File input = new File(sshUpstreamBaseline, relative)
        if ((directory ? !input.isDirectory() : !input.isFile()) || input.canonicalPath != input.absolutePath) {
            throw new GradleException('Fixed upstream baseline input is missing or noncanonical')
        }
        for (File component = input; component != null && component != sshUpstreamBaseline; component = component.parentFile) {
            if (java.nio.file.Files.isSymbolicLink(component.toPath())) {
                throw new GradleException('Fixed upstream baseline input must not contain symlinks')
            }
        }
        return input
    }
    def baselineTreeInputs = { String relative ->
        File directory = baselineInput(relative, true)
        // Include every regular file, including Ant's default exclusions such
        // as .gitignore, so task inputs match the complete pinned manifest.
        def members = []
        def walk = java.nio.file.Files.walk(directory.toPath())
        try {
            walk.forEach { path ->
                String member = sshUpstreamBaseline.toPath().relativize(path).toString()
                boolean memberDirectory = java.nio.file.Files.isDirectory(path, java.nio.file.LinkOption.NOFOLLOW_LINKS)
                File verified = baselineInput(member, memberDirectory)
                if (!memberDirectory) members.add(verified)
            }
        } finally {
            walk.close()
        }
        return members.collect { member ->
            baselineInput(sshUpstreamBaseline.toPath().relativize(member.toPath()).toString(), false)
        }
    }
    tasks.register('compileSshUpstreamProbe', Exec) {
        inputs.file('src/main/cpp/ssh_upstream_probe.c')
        inputs.files(upstreamRunner, upstreamPatch)
        inputs.property('baseline', sshUpstreamBaselineOption)
        inputs.files([
            'inputs/openssh-10.6p1.tar.gz', 'inputs/openssl-3.5.9.tar.gz',
            'inputs/openssh-10.6p1-bionic-includes.patch',
            'evidence/artifacts.sha256', 'evidence/source-archives.sha256',
            'evidence/local-patch-inputs.sha256', 'evidence/local-patch-output.sha256',
            'evidence/source-notices.sha256', 'evidence/local-changes.txt',
            'evidence/scope.txt', 'evidence/NOTICE-policy.txt',
            'evidence/openssh-config.h', 'evidence/openssh-Makefile',
            'openssh-build/config.h', 'openssh-build/Makefile',
            'openssh-build/libssh.a', 'openssh-build/openbsd-compat/libopenbsd-compat.a',
            'openssh-build/ssh', 'openssl-prefix/lib/libcrypto.a'
        ].collect { baselineInput(it, false) })
        inputs.files(baselineTreeInputs('openssl-prefix'))
        inputs.files(baselineTreeInputs('sources/openssh-10.6p1'))
        inputs.files(baselineTreeInputs('evidence/source-notices'))
        inputs.files(baselineTreeInputs('openssh-build'))
        for (String name : ['libctos_ssh_upstream_probe.so', 'libctos_ssh_upstream_client.so', 'libctos_ssh_upstream_baseline.so']) {
            outputs.file(upstreamLibraries.map { it.file(name) })
        }
        outputs.dir(upstreamNotices)
        workingDir rootProject.file('..')
        commandLine 'bash', upstreamRunner.absolutePath, '--baseline', sshUpstreamBaselineOption
    }
    tasks.matching { it.name == 'preSecretsFixtureReleaseBuild' || it.name == 'preSecretsFixtureDebugBuild' }.configureEach {
        dependsOn 'compileSshUpstreamProbe'
    }
}
